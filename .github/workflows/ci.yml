name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: types
        run: npx tsc --noEmit
      - name: python syntax
        run: python -m py_compile scripts/*.py
      - name: timeline compiles
        run: python scripts/make_timeline.py --strict
      - name: arabic scan (no mojibake in sources)
        run: python scripts/qa.py --arabic-only

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: remotion bundle (proves every import resolves)
        run: npx remotion bundle src/index.ts --out-dir out/bundle

  stills:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: one still per aspect
        run: |
          npx remotion still src/index.ts Studio16x9 out/qa/wide.png --frame=300
          npx remotion still src/index.ts Studio9x16 out/qa/vert.png --frame=300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stills
          path: out/qa/*.png
