name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: types
        run: npx tsc --noEmit
      - name: python syntax
        run: python -m py_compile scripts/*.py evals/*.py
      - name: timeline compiles and fits the voice
        run: python scripts/make_timeline.py --strict
      - name: arabic scan
        run: python scripts/qa.py --arabic-only
      - name: corpus gate (references are pinned, not remembered)
        run: python scripts/corpus.py check --min 3
      - name: design review has no MUST findings
        run: python scripts/advise.py --strict
      - name: golden briefs compile and score above the floor
        run: python evals/run_evals.py --min-score 90
      - name: declared captures match their hashes
        run: python scripts/provenance.py --strict

      - name: MCP wire contract
        run: python scripts/mcp_selftest.py
      - name: ui source scanner runs
        run: python scripts/ui_source.py --rea

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: remotion bundle proves every import resolves
        run: npx remotion bundle src/index.ts --out-dir out/bundle

  stills:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: one still per aspect
        run: |
          npx remotion still src/index.ts Studio16x9 out/qa/wide.png --frame=300
          npx remotion still src/index.ts Studio9x16 out/qa/vert.png --frame=300
          npx remotion still src/index.ts Portrait4x5 out/qa/p45.png --frame=300
          npx remotion still src/index.ts Square1x1 out/qa/sq.png --frame=300
      - name: platform safe areas (measured on the pixels)
        run: |
          python -m pip install --quiet pillow numpy
          python scripts/safe_area.py out/qa/vert.png --preset reels --strict
          python scripts/safe_area.py out/qa/p45.png out/qa/sq.png --preset feed --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stills
          path: out/qa/*.png
